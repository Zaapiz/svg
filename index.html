<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="calculator">
      <h1>Scientific Calculator</h1>
      <input id="display" class="display" type="text" value="0" readonly aria-label="Calculator display" />
      <div class="keys">
        <button data-action="clear">AC</button>
        <button data-action="delete">DEL</button>
        <button data-value="(">(</button>
        <button data-value=")">)</button>

        <button data-fn="sin">sin</button>
        <button data-fn="cos">cos</button>
        <button data-fn="tan">tan</button>
        <button data-op="/">÷</button>

        <button data-value="7">7</button>
        <button data-value="8">8</button>
        <button data-value="9">9</button>
        <button data-op="*">×</button>

        <button data-value="4">4</button>
        <button data-value="5">5</button>
        <button data-value="6">6</button>
        <button data-op="-">−</button>

        <button data-value="1">1</button>
        <button data-value="2">2</button>
        <button data-value="3">3</button>
        <button data-op="+">+</button>

        <button data-const="PI">π</button>
        <button data-const="E">e</button>
        <button data-value="0">0</button>
        <button data-value=".">.</button>

        <button data-fn="sqrt">√</button>
        <button data-fn="log10">log</button>
        <button data-fn="log">ln</button>
        <button data-value="**">xʸ</button>

        <button class="equals" data-action="equals">=</button>
      </div>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
